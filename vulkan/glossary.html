<style>
  .g-tools { position: sticky; top: var(--topbar-h); z-index: 5; background: var(--bg); padding: .8rem 0 .6rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
  .g-tools input { width: 100%; padding: .7rem .9rem; font-size: 1rem; border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg-elev); }
  .chips { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .6rem; font-family: var(--font-ui); }
  .chips button { border: 1px solid var(--border); background: var(--bg-elev); border-radius: 99px; padding: .25rem .7rem; font-size: .8rem; cursor: pointer; color: var(--text-2); }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root[data-theme="dark"] .chips button[aria-pressed="true"] { color: #1a1208; }
  .g-count { font-family: var(--font-ui); font-size: .8rem; color: var(--text-3); margin-top: .4rem; }
  .g-entry { padding: 1rem 1.1rem .5rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); margin-bottom: .7rem; scroll-margin-top: 12rem; }
  .g-entry:target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .g-entry h2 { font-size: 1.1rem; margin: 0 0 .3rem; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
  .g-entry .aka { font-family: var(--font-ui); font-size: .78rem; color: var(--text-3); font-weight: 400; }
  .g-entry .see { font-family: var(--font-ui); font-size: .82rem; color: var(--text-2); }
  .g-entry .see a { margin-right: .5rem; }
  .g-letter { font-family: var(--font-ui); font-weight: 800; color: var(--text-3); margin: 1.4rem 0 .5rem; font-size: .9rem; }
</style>

<style id="sitegate-style">
#sitegate{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:24px 16px;overflow:auto;
  background:#F4F6F8;color:#15202B;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--sg-line:#AEBBC7;--sg-accent:#2347D6;--sg-on:#fff;--sg-soft:#4A5866;--sg-bad:#C02B3A;--sg-field:#fff}
@media (prefers-color-scheme:dark){#sitegate{background:#0E141B;color:#E4EAF0;--sg-line:#3A4A5B;--sg-accent:#8EA6FF;--sg-on:#0E141B;--sg-soft:#A9B6C2;--sg-bad:#FF7A85;--sg-field:#151D26}}
html[data-theme="light"] #sitegate{background:#F4F6F8;color:#15202B;--sg-line:#AEBBC7;--sg-accent:#2347D6;--sg-on:#fff;--sg-soft:#4A5866;--sg-bad:#C02B3A;--sg-field:#fff}
html[data-theme="dark"] #sitegate{background:#0E141B;color:#E4EAF0;--sg-line:#3A4A5B;--sg-accent:#8EA6FF;--sg-on:#0E141B;--sg-soft:#A9B6C2;--sg-bad:#FF7A85;--sg-field:#151D26}
#sitegate.checking .sg-card,#sitegate.loading .sg-card{visibility:hidden}
#sitegate .sg-wait{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;color:var(--sg-soft);font-size:.95rem;opacity:0;pointer-events:none}
#sitegate.checking .sg-wait,#sitegate.loading .sg-wait{animation:sg-wait .2s ease-out .6s forwards}
@keyframes sg-wait{to{opacity:1}}
#sitegate.done{opacity:0;transition:opacity .18s ease-out}
@media (prefers-reduced-motion:reduce){#sitegate.done{transition:none}}
#sitegate .sg-card{width:min(380px,100%);display:grid;gap:10px}
#sitegate h1{font-size:1.6rem;line-height:1.15;margin:0}
#sitegate p{margin:0;color:var(--sg-soft)}
#sitegate label{font-weight:700;font-size:.92rem;margin-top:8px}
#sitegate .sg-row{display:flex;gap:8px}
#sitegate input{flex:1;min-width:0;height:44px;padding:0 12px;font:inherit;color:inherit;background:var(--sg-field);border:1.5px solid var(--sg-line);border-radius:6px}
#sitegate button{height:44px;padding:0 16px;font:inherit;font-weight:700;border-radius:6px;cursor:pointer;border:1.5px solid var(--sg-line);background:transparent;color:inherit}
#sitegate .sg-submit{background:var(--sg-accent);border-color:var(--sg-accent);color:var(--sg-on);margin-top:4px}
#sitegate .sg-submit:disabled{opacity:.6;cursor:progress}
#sitegate :focus-visible{outline:3px solid var(--sg-accent);outline-offset:2px}
#sitegate .sg-error{color:var(--sg-bad);font-weight:700}
#sitegate .sg-note{font-size:.85rem}
</style>
