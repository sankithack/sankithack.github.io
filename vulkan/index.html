<style>
  .main > .home-wide { max-width: 64rem; }
  .hero { display: grid; grid-template-columns: minmax(0, 23rem) minmax(0, 1fr); gap: 2.5rem; align-items: center; padding: .5rem 0 1rem; }
  .hero h1 { font-size: clamp(2.8rem, 4.4vw + 1rem, 4.6rem); line-height: .95; margin: 0 0 1.1rem; }
  .hero .lede { font-size: 1.2rem; line-height: 1.5; color: var(--text-2); margin: 0 0 1.5rem; }
  .cta { display: flex; gap: .7rem; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; height: 2.75rem; padding: 0 1.15rem; border-radius: var(--radius-sm); font-weight: 700; text-decoration: none; border: 1.5px solid var(--border-strong); color: var(--text); background: var(--bg-elev); }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.1); }
  .resume { margin: 1.3rem 0 0; padding-left: .9rem; border-left: 3px solid var(--ok); font-size: .95rem; display: none; }
  .resume.show { display: block; }
  .hero-fb { margin: 0; }
  .hero-fb .frame { border: 1px solid var(--border-strong); border-radius: 8px; background: var(--stage-bg); padding: 10px; }
  .hero-fb canvas { display: block; width: 100%; touch-action: none; cursor: grab; border-radius: 3px; }
  .hero-fb canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .hero-fb figcaption { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .hero-fb .count { font-variant-numeric: tabular-nums; color: var(--text-3); }
  @media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 1.6rem; } }

  /* Parts flow down the first column, then the second, like a book's contents page:
     a short part never leaves a gap beside a long one. */
  .parts { columns: 2; column-gap: 3rem; margin-top: 1rem; }
  .parts .part { break-inside: avoid; margin: 0 0 2rem; display: inline-block; width: 100%; }
  @media (max-width: 760px) { .parts { columns: 1; } }
  .part h3 { display: flex; gap: .6rem; align-items: baseline; margin: 1.2rem 0 .3rem; font-size: 1.4rem; font-weight: 700; }
  .part h3 .pn { color: var(--accent); font-size: 1.9rem; line-height: 1; }
  .part .blurb { color: var(--text-2); margin: 0 0 .6rem; font-size: .97rem; }
  .ch-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--border); }
  .ch-list li { margin: 0; border-bottom: 1px solid var(--border); }
  .ch-list a { display: grid; grid-template-columns: 2rem 1fr auto; gap: .5rem; padding: .45rem .2rem; color: var(--text); text-decoration: none; align-items: baseline; }
  .ch-list a:hover { background: var(--bg-hover); }
  .ch-list .row { display: grid; grid-template-columns: 2rem 1fr auto; gap: .5rem; padding: .45rem .2rem; align-items: baseline; color: var(--text-3); }
  .ch-list .tag { font-size: .8rem; color: var(--text-3); }
  .ch-list .n { font-family: var(--font-display); font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .ch-list .ok { color: var(--ok); font-weight: 700; font-size: .85rem; }
  .how { display: grid; grid-template-columns: max-content 1fr; gap: .6rem 1.4rem; margin: 1rem 0; }
  .how dt { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
  .how dd { margin: 0; color: var(--text-2); }
  @media (max-width: 560px) { .how { grid-template-columns: 1fr; } .how dd { margin-bottom: .6rem; } }
</style>

<style id="sitegate-style">
#sitegate{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:24px 16px;overflow:auto;
  background:#F4F6F8;color:#15202B;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--sg-line:#AEBBC7;--sg-accent:#2347D6;--sg-on:#fff;--sg-soft:#4A5866;--sg-bad:#C02B3A;--sg-field:#fff}
@media (prefers-color-scheme:dark){#sitegate{background:#0E141B;color:#E4EAF0;--sg-line:#3A4A5B;--sg-accent:#8EA6FF;--sg-on:#0E141B;--sg-soft:#A9B6C2;--sg-bad:#FF7A85;--sg-field:#151D26}}
html[data-theme="light"] #sitegate{background:#F4F6F8;color:#15202B;--sg-line:#AEBBC7;--sg-accent:#2347D6;--sg-on:#fff;--sg-soft:#4A5866;--sg-bad:#C02B3A;--sg-field:#fff}
html[data-theme="dark"] #sitegate{background:#0E141B;color:#E4EAF0;--sg-line:#3A4A5B;--sg-accent:#8EA6FF;--sg-on:#0E141B;--sg-soft:#A9B6C2;--sg-bad:#FF7A85;--sg-field:#151D26}
#sitegate.checking .sg-card,#sitegate.loading .sg-card{visibility:hidden}
#sitegate .sg-wait{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;color:var(--sg-soft);font-size:.95rem;opacity:0;pointer-events:none}
#sitegate.checking .sg-wait,#sitegate.loading .sg-wait{animation:sg-wait .2s ease-out .6s forwards}
@keyframes sg-wait{to{opacity:1}}
#sitegate.done{opacity:0;transition:opacity .18s ease-out}
@media (prefers-reduced-motion:reduce){#sitegate.done{transition:none}}
#sitegate .sg-card{width:min(380px,100%);display:grid;gap:10px}
#sitegate h1{font-size:1.6rem;line-height:1.15;margin:0}
#sitegate p{margin:0;color:var(--sg-soft)}
#sitegate label{font-weight:700;font-size:.92rem;margin-top:8px}
#sitegate .sg-row{display:flex;gap:8px}
#sitegate input{flex:1;min-width:0;height:44px;padding:0 12px;font:inherit;color:inherit;background:var(--sg-field);border:1.5px solid var(--sg-line);border-radius:6px}
#sitegate button{height:44px;padding:0 16px;font:inherit;font-weight:700;border-radius:6px;cursor:pointer;border:1.5px solid var(--sg-line);background:transparent;color:inherit}
#sitegate .sg-submit{background:var(--sg-accent);border-color:var(--sg-accent);color:var(--sg-on);margin-top:4px}
#sitegate .sg-submit:disabled{opacity:.6;cursor:progress}
#sitegate :focus-visible{outline:3px solid var(--sg-accent);outline-offset:2px}
#sitegate .sg-error{color:var(--sg-bad);font-weight:700}
#sitegate .sg-note{font-size:.85rem}
</style>
